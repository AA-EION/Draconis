name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch MaximaHelper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/fetch-maxima-helper.sh

      - name: Build Steam webhelper wrapper
        run: |
          brew install mingw-w64
          bash Scripts/build-steam-wrapper.sh
          test -f Draconis/Resources/steamwebhelper.exe

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Draconis.xcodeproj \
            -scheme Draconis \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_TESTABILITY=NO \
            clean build \
            | xcpretty || xcodebuild \
              -project Draconis.xcodeproj \
              -scheme Draconis \
              -configuration Debug \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              ENABLE_TESTABILITY=NO \
              clean build

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Swift and packaging tools
        run: |
          bash Scripts/linux-setup-swift.sh
          sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - uses: dtolnay/rust-toolchain@stable

      - name: Test core and engine
        run: |
          swift test --package-path Core
          swift test --package-path CrossPlatform

      - name: Test the UI
        run: cargo test --locked --manifest-path Desktop/Cargo.toml

      # Test packages: deb, rpm, AppImage, Flatpak and tar.gz, versioned after the commit.
      - name: Build packages
        run: bash Scripts/package-linux.sh "0.15.0-dev.${GITHUB_SHA::7}" --flatpak

      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: build/linux/dist/*

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE

      - uses: dtolnay/rust-toolchain@stable

      - name: Test core
        run: swift test --package-path Core

      - name: Build package
        shell: pwsh
        run: ./Scripts/package-windows.ps1 -Version "0.15.0-dev.$($env:GITHUB_SHA.Substring(0, 7))"

      - uses: actions/upload-artifact@v5
        with:
          name: windows-package
          path: build/windows/dist/*
