name: Look comparison

# Screenshots every page of the macOS app over a fixed wallpaper, renders the
# Linux/Windows UI over the same desktop pixels at the same size, and scores
# each pair. Nothing is published; the images are workflow artifacts.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['Desktop/**', 'Draconis/Views/**', 'Draconis/App/**', '.github/workflows/look.yml']
  pull_request:
    paths: ['Desktop/**', '.github/workflows/look.yml']

jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build Draconis.app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install xcodegen mingw-w64 cliclick
          bash Scripts/fetch-maxima-helper.sh
          bash Scripts/build-steam-wrapper.sh
          xcodegen generate
          xcodebuild -project Draconis.xcodeproj -scheme Draconis -configuration Debug \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO ENABLE_TESTABILITY=NO \
            build -quiet

      - name: Wallpaper and a sample install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots
          python3 Desktop/look/wallpaper.py "$PWD/shots/wallpaper.png"
          osascript -e "tell application \"System Events\" to tell every desktop to set picture to \"$PWD/shots/wallpaper.png\"" || echo "couldn't set the wallpaper"
          # A Draconis Wine prefix with Steam, Titanfall 2 and the latest Northstar (so no update starts).
          tag=$(gh api repos/R2Northstar/Northstar/releases/latest --jq .tag_name)
          game="$HOME/Library/Application Support/Draconis/Prefixes/Titanfall 2/drive_c/Program Files (x86)/Steam/steamapps/common/Titanfall2"
          mkdir -p "$game/R2Northstar/mods/Northstar.Client"
          touch "$game/Titanfall2.exe" "$game/NorthstarLauncher.exe" "$game/../../../steam.exe"
          echo "{\"Name\":\"Northstar.Client\",\"Version\":\"${tag#v}\"}" > "$game/R2Northstar/mods/Northstar.Client/mod.json"
          defaults write org.draconis.launcher privacyConsentAccepted -bool true
          defaults write org.draconis.launcher showConsole -bool true
          # The window's behind-window blur falls back to flat grey when transparency is reduced.
          echo "reduceTransparency before: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)" | tee shots/transparency.txt
          defaults write com.apple.universalaccess reduceTransparency -bool false 2>&1 | tee -a shots/transparency.txt || true
          sudo defaults write /Library/Preferences/com.apple.universalaccess reduceTransparency -bool false 2>&1 | tee -a shots/transparency.txt || true
          echo "after: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)" | tee -a shots/transparency.txt
          system_profiler SPDisplaysDataType >> shots/transparency.txt 2>&1 || true
          killall Dock SystemUIServer 2>/dev/null || true
          sleep 3
          screencapture -x shots/desktop.png

      - name: Screenshot every page
        run: |
          rect() { osascript -e "tell application \"System Events\" to tell process \"Draconis\" to get {position, size} of $1" | tr -d ' '; }
          open build/Build/Products/Debug/Draconis.app
          sleep 30
          osascript -e 'tell application "Draconis" to activate' || true
          sleep 2
          r=$(rect "window 1"); echo "$r" > shots/macos-window.txt
          IFS=, read -r x y w h <<< "$r"
          # Sidebar rows (window coordinates, from the Play screenshot): Play 86, Mods 118, Servers 150, Console 182.
          for page in play:86 mods:118 servers:150 console:182; do
            cliclick "c:$((x + 70)),$((y + ${page#*:}))"
            sleep 6
            screencapture -x "shots/macos-${page%%:*}.png"
          done
          cliclick "c:$((x + 70)),$((y + 86))"
          osascript -e 'tell application "System Events" to keystroke "," using command down'
          sleep 4
          screencapture -x shots/macos-settings.png
          rect "window 1" > shots/macos-settings-window.txt
          osascript -e 'tell application "System Events" to tell process "Draconis" to get entire contents of window 1' > shots/macos-settings-ax.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: look-macos
          path: shots/

  compare:
    name: Linux/Windows UI against macOS
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Software Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev imagemagick
      - uses: actions/download-artifact@v4
        with:
          name: look-macos
          path: mac
      - name: Render and compare
        run: |
          cargo build --release --manifest-path Desktop/Cargo.toml
          bash Desktop/look/compare.sh mac shots Desktop/target/release/draconis
          cat shots/scores.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: look-compare
          path: shots/
