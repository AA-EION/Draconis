name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Same release, started by hand: creates the tag on the commit it runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.12.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "error: '$TAG' is not a vX.Y.Z tag" >&2; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install xcodegen create-dmg

      - name: Fetch MaximaHelper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/fetch-maxima-helper.sh

      - name: Build Steam webhelper wrapper
        run: |
          brew install mingw-w64
          bash Scripts/build-steam-wrapper.sh
          test -f Draconis/Resources/steamwebhelper.exe

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Draconis.xcodeproj \
            -scheme Draconis \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${TAG#v}" \
            clean build

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -r "build/Build/Products/Release/Draconis.app" dmg-staging/
          create-dmg \
            --volname "Draconis" \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Draconis.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "Draconis.app" \
            "Draconis-${TAG}.dmg" \
            dmg-staging/

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${TAG#v}"
          # Pull the lines between the matching `## [X.Y.Z]` heading and the
          # next `## [` heading. If the section isn't found we fall back to a
          # blank body so the install instructions still render below.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          # Prereleases (vX.Y.Z-tag) fall back to the Unreleased section.
          if [ ! -s release-notes.md ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            awk '
              /^## \[Unreleased\]/ { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "warning: no CHANGELOG section found for $VERSION" >&2
          fi
          cat >> release-notes.md <<'EOF'

          ---

          ### Installation

          **macOS** (Tahoe 26+)
          1. Download `Draconis-${{ env.TAG }}.dmg`, open it and drag **Draconis.app** to Applications
          2. Draconis isn't notarised, so clear the download flag once:
             `xattr -dr com.apple.quarantine /Applications/Draconis.app`

          **Linux** (x86_64, needs GTK 4)
          - AppImage: `chmod +x Draconis-*.AppImage` and run it
          - Debian/Ubuntu: `sudo apt install ./draconis_*_amd64.deb`
          - Fedora/openSUSE: `sudo dnf install ./draconis-*.x86_64.rpm`
          - Flatpak: `flatpak install --user Draconis-*.flatpak`
          - Anything else: extract the `.tar.gz` and run `./draconis`

          **Windows** (10/11, x64)
          - Extract `Draconis-*-windows-x64.zip` and run `Draconis.exe`. It needs the
            [Windows App SDK runtime](https://aka.ms/windowsappsdk/1.5/latest/windowsappruntimeinstall-x64.exe).

          Checksums are in `SHA256SUMS`.
          EOF

      - name: Upload DMG and notes
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Draconis-${{ env.TAG }}.dmg
            release-notes.md

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Swift, GTK 4 and packaging tools
        run: |
          bash Scripts/linux-setup-swift.sh
          sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Build packages
        run: bash Scripts/package-linux.sh "${TAG#v}" --flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/dist/*

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE

      - name: Build package
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          ./Scripts/package-windows.ps1 -Version $tag.TrimStart('v')

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/dist/*

  publish:
    name: Publish release
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cat artifacts/linux/SHA256SUMS artifacts/windows/SHA256SUMS-windows > SHA256SUMS
          (cd artifacts/macos && sha256sum *.dmg) >> SHA256SUMS
          rm artifacts/linux/SHA256SUMS artifacts/windows/SHA256SUMS-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Draconis ${{ env.TAG }}"
          body_path: artifacts/macos/release-notes.md
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            artifacts/macos/*.dmg
            artifacts/linux/*
            artifacts/windows/*
            SHA256SUMS
