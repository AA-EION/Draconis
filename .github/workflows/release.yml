name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Same release, started by hand: creates the tag on the commit it runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.12.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "error: '$TAG' is not a vX.Y.Z tag" >&2; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install xcodegen create-dmg

      - name: Fetch MaximaHelper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Scripts/fetch-maxima-helper.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Draconis.xcodeproj \
            -scheme Draconis \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${TAG#v}" \
            clean build

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -r "build/Build/Products/Release/Draconis.app" dmg-staging/
          create-dmg \
            --volname "Draconis" \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Draconis.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "Draconis.app" \
            "Draconis-${TAG}.dmg" \
            dmg-staging/

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${TAG#v}"
          # Pull the lines between the matching `## [X.Y.Z]` heading and the
          # next `## [` heading. If the section isn't found we fall back to a
          # blank body so the install instructions still render below.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          # Prereleases (vX.Y.Z-tag) fall back to the Unreleased section.
          if [ ! -s release-notes.md ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            awk '
              /^## \[Unreleased\]/ { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "warning: no CHANGELOG section found for $VERSION" >&2
          fi
          cat >> release-notes.md <<'EOF'

          ---

          ### Installation
          1. Download `Draconis-${{ env.TAG }}.dmg` below
          2. Open the DMG and drag **Draconis.app** to Applications
          3. Draconis isn't notarised, so clear the download flag once (macOS Tahoe 26.6+ otherwise only offers *Move to Trash*):
             `xattr -dr com.apple.quarantine /Applications/Draconis.app`
          4. Launch and follow the setup wizard

          > **Requires macOS Tahoe (26.0) or later.**
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Draconis ${{ env.TAG }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            Draconis-${{ env.TAG }}.dmg
